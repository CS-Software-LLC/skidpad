<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skidpad · Babylon.js + Jolt</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #e8edf2;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 12px;
        background: rgba(16, 20, 26, 0.8);
        border-radius: 6px;
        white-space: pre;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">loading…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
