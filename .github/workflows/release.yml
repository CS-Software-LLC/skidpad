name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Requires two repository settings:
      #   Settings → Actions → General → Workflow permissions →
      #     "Allow GitHub Actions to create and approve pull requests"
      #   Settings → Secrets → Actions → NPM_TOKEN (only once packages publish)
      # Without NPM_TOKEN the action only maintains the "version packages" PR
      # and never publishes, which is the intended state before the public
      # launch.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: ${{ secrets.NPM_TOKEN != '' && 'pnpm release' || '' }}
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
