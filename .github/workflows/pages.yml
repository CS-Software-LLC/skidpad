name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SANDBOX_BASE: /${{ github.event.repository.name }}/sandbox/
      DOCS_BASE: /${{ github.event.repository.name }}/docs/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm:release
      - run: pnpm build
      - run: pnpm build:apps
      - name: Assemble site with validation and benchmark results
        run: node scripts/assemble-site.mjs
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run so the repository owner does
          # not have to enable it by hand (Settings → Pages → Source: GitHub
          # Actions). Needs the `pages: write` permission declared above.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
